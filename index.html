<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="description" content="Crypticus: compite resolviendo cripticos contra tus amigos en tiempo real." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <title>Crypticus · Competencias de cripticos</title>
    <script>
      // Tema antes del primer pintado (evita un destello del tema Normal). La app lo vuelve a aplicar al iniciar.
      try {
        var s = JSON.parse(localStorage.getItem('crypticus.settings.v1') || '{}');
        var r = document.documentElement;
        var skin = s.skin === 'medieval' ? 'crypt' : s.skin; // Cripta se llamó Medieval hasta v1.0.1.
        if (skin === 'crypt' || skin === 'cyber') r.setAttribute('data-skin', skin);
        // Cripta: el muro y la antorcha empiezan a bajar ya, en paralelo con la app (no al montar el fondo).
        if (skin === 'crypt') {
          var wall = window.matchMedia('(orientation: portrait)').matches ? 'wall-mobile' : 'wall';
          ['/themes/crypt/' + wall + '.webp', '/themes/crypt/torch-1.webp', '/themes/crypt/parchment.webp'].forEach(function (href) {
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'image';
            l.href = href;
            l.setAttribute('fetchpriority', 'high');
            document.head.appendChild(l);
          });
        }
        if (s.theme === 'light' || s.theme === 'dark') r.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
