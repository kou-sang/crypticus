<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="description" content="Crypticus: compite resolviendo cripticos contra tus amigos en tiempo real." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <title>Crypticus · Competencias de cripticos</title>
    <script>
      // Tema antes del primer pintado (evita un destello del tema Normal). La app lo vuelve a aplicar al iniciar.
      try {
        var s = JSON.parse(localStorage.getItem('crypticus.settings.v1') || '{}');
        var r = document.documentElement;
        if (s.skin === 'medieval' || s.skin === 'cyber') r.setAttribute('data-skin', s.skin);
        if (s.theme === 'light' || s.theme === 'dark') r.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
