name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install-scripts ls
      - run: npm install-scripts approve esbuild workerd
      - run: npm rebuild esbuild workerd
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci
          VITE_FIREBASE_APP_ID: ci
      # Valida bundle del Worker + Durable Object sin desplegar.
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
